name: carving_knife
description: A new Flutter project.
publish_to: 'none'

version: 2.0.0+2

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.18.0
  android_intent_plus: ^5.0.2
  file_picker: ^8.1.3
  permission_handler: ^11.1.0
  share_plus: ^7.2.1
  http: ^1.1.0
  package_info_plus: ^4.2.0
  url_launcher: ^6.2.1
  image_picker: ^1.0.7
  palette_generator: ^0.3.3+3
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2
  supabase_flutter: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
